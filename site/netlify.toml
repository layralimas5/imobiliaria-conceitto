# Netlify build settings.
#
# The site lives in `site/`, not at the repository root, so `base` points there
# and every other path below is relative to it. The Next.js runtime plugin is
# what turns the App Router build into Netlify functions — without it only the
# static pages would deploy and every dynamic route would 404.

[build]
  base = "site"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Pinned so a change to Netlify's default never moves the build under us.
  NODE_VERSION = "22"

# `NEXT_PUBLIC_SITE_URL` and the lead-delivery secrets are set in the Netlify
# UI, never here: this file is committed and they are not.
